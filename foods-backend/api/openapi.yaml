      operationId: createUser
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } } }
      responses: { "201": { description: Usuario creado } }
  /v1/admin/users/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateUser
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } } }
      responses: { "200": { description: Usuario actualizado } }
  /v1/admin/users/{id}/status:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch: { operationId: updateUserStatus, security: [{ sessionCookie: [] }], responses: { "204": { description: Estado actualizado }, "409": { description: No puede desactivarse a sí mismo } } }
components:
  securitySchemes: { sessionCookie: { type: apiKey, in: cookie, name: foods_session }, conciergeServiceKey: { type: apiKey, in: header, name: X-Fudia-Concierge-Key } }
  parameters:
    EntityId: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: Solicitud inválida, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Sesión inválida, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Permiso insuficiente, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Health: { type: object, required: [status, service, version], properties: { status: { type: string, const: ok }, service: { type: string }, version: { type: string } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, minLength: 8 } } }
    SubscriptionPlanInput: { type: object, required: [code, name, currency, monthlyPrice, annualPrice, trialDays, moduleKeys, termsVersion, active], properties: { code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,39}$" }, name: { type: string }, description: { type: string }, currency: { type: string, pattern: "^[A-Z]{3}$" }, monthlyPrice: { type: string }, annualPrice: { type: string }, trialDays: { type: integer, minimum: 0, maximum: 365 }, maxLocations: { type: [integer, "null"], minimum: 1 }, maxUsers: { type: [integer, "null"], minimum: 1 }, moduleKeys: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }, termsVersion: { type: string }, active: { type: boolean } } }
    SubscriptionPlan: { allOf: [{ $ref: "#/components/schemas/SubscriptionPlanInput" }, { type: object, required: [id], properties: { id: { type: string, format: uuid } } }] }
    SubscriptionUpdateInput: { type: object, required: [planId, billingCycle, status, autoRenew, termsAccepted], properties: { planId: { type: string, format: uuid }, billingCycle: { type: string, enum: [monthly, annual] }, status: { type: string, enum: [trial, active, past_due, cancelled] }, autoRenew: { type: boolean }, termsAccepted: { type: boolean } } }
    SubscriptionPaymentInput: { type: object, required: [amount, currency, status, provider], properties: { amount: { type: string }, currency: { type: string, pattern: "^[A-Z]{3}$" }, status: { type: string, enum: [pending, paid, failed, refunded] }, provider: { type: string }, externalReference: { type: string }, paidAt: { type: string, format: date-time } } }
    OrganizationSubscription: { type: object, required: [id, plan, billingCycle, priceAmount, currency, status, autoRenew, usage, payments], properties: { id: { type: string, format: uuid }, plan: { $ref: "#/components/schemas/SubscriptionPlan" }, billingCycle: { type: string, enum: [monthly, annual] }, priceAmount: { type: string }, currency: { type: string }, status: { type: string, enum: [trial, active, past_due, cancelled] }, trialStartsAt: { type: [string, "null"], format: date-time }, trialEndsAt: { type: [string, "null"], format: date-time }, currentPeriodStartsAt: { type: [string, "null"], format: date-time }, currentPeriodEndsAt: { type: [string, "null"], format: date-time }, renewsAt: { type: [string, "null"], format: date-time }, autoRenew: { type: boolean }, termsVersion: { type: [string, "null"] }, termsAcceptedAt: { type: [string, "null"], format: date-time }, usage: { type: object, required: [locations, users], properties: { locations: { type: integer }, users: { type: integer } } }, payments: { type: array, items: { type: object } } } }
    TenantOnboardingInput: { type: object, required: [legalName, tradeName, taxId, timezone, planId, billingCycle, termsAccepted, country, currency, currencyPosition, taxName, taxRate, taxIncluded, locationName, locationCode, address, adminName, adminEmail, adminPassword], properties: { legalName: { type: string }, tradeName: { type: string }, taxId: { type: string, minLength: 6, maxLength: 32 }, timezone: { type: string }, planId: { type: string, format: uuid }, billingCycle: { type: string, enum: [monthly, annual] }, termsAccepted: { type: boolean, const: true }, country: { type: string, pattern: "^[A-Z]{2}$", default: PE }, currency: { type: string, pattern: "^[A-Z]{3}$", default: PEN }, currencyPosition: { type: string, enum: [before, after] }, taxName: { type: string }, taxRate: { type: string }, taxIncluded: { type: boolean }, locationName: { type: string }, locationCode: { type: string }, address: { type: string }, adminName: { type: string }, adminEmail: { type: string, format: email }, adminPassword: { type: string, minLength: 8, writeOnly: true } } }
    Dashboard: { type: object, required: [products, criticalStock, purchasesToApprove, currency], properties: { products: { type: integer }, criticalStock: { type: integer }, purchasesToApprove: { type: integer }, currency: { type: string, pattern: "^[A-Z]{3}$" } } }
    ContextLocation: { type: object, required: [id, name, country, timezone], properties: { id: { type: string, format: uuid }, name: { type: string }, country: { type: string, pattern: "^[A-Z]{2}$" }, timezone: { type: string } } }
    SessionContext: { type: object, required: [user, organization, location, modules, menuAccess, permissions], properties: { user: { type: object, required: [id, name, platformAdmin], properties: { id: { type: string, format: uuid }, name: { type: string }, platformAdmin: { type: boolean } } }, organization: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }, location: { $ref: "#/components/schemas/ContextLocation" }, modules: { type: object, additionalProperties: { type: boolean } }, menuAccess: { type: array, items: { type: string } }, permissions: { type: array, items: { type: string } } } }
    SwitchContextInput: { type: object, required: [organizationId, locationId], properties: { organizationId: { type: string, format: uuid }, locationId: { type: string, format: uuid } } }
    ContextSwitchResponse: { type: object, required: [organization, location], properties: { organization: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }, location: { $ref: "#/components/schemas/ContextLocation" } } }
    CurrencyOption: { type: object, required: [code, name, symbol, decimals], properties: { code: { type: string, pattern: "^[A-Z]{3}$" }, name: { type: string }, symbol: { type: string }, decimals: { type: integer, minimum: 0, maximum: 4 } } }
    CountryOption: { type: object, required: [code, name, defaultCurrency], properties: { code: { type: string, pattern: "^[A-Z]{2}$" }, name: { type: string }, defaultCurrency: { type: string, pattern: "^[A-Z]{3}$" } } }
    OrganizationSettingsInput: { type: object, required: [country, currency, currencyPosition, taxName, taxRate, taxIncluded], properties: { country: { type: string, pattern: "^[A-Z]{2}$", default: PE }, currency: { type: string, pattern: "^[A-Z]{3}$", default: PEN }, currencyPosition: { type: string, enum: [before, after] }, taxName: { type: string, maxLength: 30 }, taxRate: { type: number, minimum: 0, maximum: 1 }, taxIncluded: { type: boolean } } }
    OrganizationSettings: { allOf: [{ $ref: "#/components/schemas/OrganizationSettingsInput" }, { type: object, required: [currencySymbol, currencyDecimals, currencyOptions, countryOptions], properties: { currencySymbol: { type: string }, currencyDecimals: { type: integer, minimum: 0, maximum: 4 }, currencyOptions: { type: array, items: { $ref: "#/components/schemas/CurrencyOption" } }, countryOptions: { type: array, items: { $ref: "#/components/schemas/CountryOption" } } } }] }
    OrganizationInput: { type: object, required: [legalName, tradeName, taxId, timezone], properties: { legalName: { type: string, maxLength: 180 }, tradeName: { type: string, maxLength: 180 }, taxId: { type: string, minLength: 6, maxLength: 32 }, timezone: { type: string } } }
    Organization: { allOf: [{ $ref: "#/components/schemas/OrganizationInput" }, { type: object, required: [id, active], properties: { id: { type: string, format: uuid }, active: { type: boolean } } }] }
    FiscalProfileInput: { type: object, required: [country, currency, currencyPosition, taxName, taxRate, taxIncluded, default], properties: { country: { type: string, pattern: "^[A-Z]{2}$" }, currency: { type: string, pattern: "^[A-Z]{3}$" }, currencyPosition: { type: string, enum: [before, after] }, taxName: { type: string, maxLength: 30 }, taxRate: { type: string, pattern: "^(0(\\.[0-9]+)?|1(\\.0+)?)$" }, taxIncluded: { type: boolean }, default: { type: boolean } } }
    LocationInput: { type: object, required: [name, code, address, timezone, fiscalProfileId], properties: { name: { type: string }, code: { type: string, maxLength: 30 }, address: { type: string }, timezone: { type: string }, fiscalProfileId: { type: string, format: uuid }, active: { type: boolean } } }
    ExchangeRateInput: { type: object, required: [baseCurrency, quoteCurrency, rate, effectiveAt, source], properties: { baseCurrency: { type: string, pattern: "^[A-Z]{3}$" }, quoteCurrency: { type: string, pattern: "^[A-Z]{3}$" }, rate: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }, effectiveAt: { type: string, format: date-time }, source: { type: string, enum: [manual, provider] }, providerReference: { type: [string, "null"] } } }
    CategoryInput: { type: object, required: [name, sortOrder], properties: { name: { type: string, maxLength: 120 }, sortOrder: { type: integer, minimum: 0 }, active: { type: boolean }, productScope: { type: string, enum: [prepared, retail, both], default: prepared, description: "Indica si la categoría puede clasificar productos preparados, mercadería vendible o ambos." } } }
    Category: { allOf: [{ $ref: "#/components/schemas/CategoryInput" }, { type: object, required: [id, active, productScope, productCount], properties: { id: { type: string, format: uuid }, active: { type: boolean }, productCount: { type: integer } } }] }
    ProductInput: { type: object, required: [name, price], properties: { sku: { type: string, maxLength: 40 }, name: { type: string, maxLength: 160 }, description: { type: string, maxLength: 1000 }, categoryId: { type: [string, "null"], format: uuid }, price: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }, active: { type: boolean }, productType: { type: string, enum: [prepared, retail], default: prepared, description: "Clasificación operativa independiente de categoría y control de cantidad." }, quantityControl: { type: string, enum: [none, portions, inventory], default: none } } }
    Product: { allOf: [{ $ref: "#/components/schemas/ProductInput" }, { type: object, required: [id, active, productType, quantityControl], properties: { id: { type: string, format: uuid }, categoryName: { type: [string, "null"] }, active: { type: boolean } } }] }
    ProductModifierOptionInput: { type: object, required: [name, surcharge], properties: { name: { type: string, minLength: 1, maxLength: 80 }, surcharge: { type: string, description: "Recargo monetario no negativo; foods-backend es la fuente de verdad." } } }
    ProductModifierGroupInput: { type: object, required: [name, required, minSelections, maxSelections, options], properties: { name: { type: string, minLength: 1, maxLength: 80 }, required: { type: boolean }, minSelections: { type: integer, minimum: 0 }, maxSelections: { type: integer, minimum: 1 }, options: { type: array, items: { $ref: "#/components/schemas/ProductModifierOptionInput" } } } }
    ProductModifierConfigInput: { type: object, required: [groups], properties: { groups: { type: array, items: { $ref: "#/components/schemas/ProductModifierGroupInput" } } } }
    ProductModifierOption: { allOf: [{ $ref: "#/components/schemas/ProductModifierOptionInput" }, { type: object, required: [id], properties: { id: { type: string, format: uuid } } }] }
    ProductModifierGroup: { type: object, required: [id, name, required, minSelections, maxSelections, options], properties: { id: { type: string, format: uuid }, name: { type: string }, required: { type: boolean }, minSelections: { type: integer }, maxSelections: { type: integer }, options: { type: array, items: { $ref: "#/components/schemas/ProductModifierOption" } } } }
