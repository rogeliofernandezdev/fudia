openapi: 3.1.0
info: { title: Foods API, version: 0.3.0, description: API operativa y administrativa multiempresa. }
servers: [{ url: http://localhost:8080 }]
paths:
  /health:
    get:
      operationId: getHealth
      responses: { "200": { description: Disponible, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } } }
  /v1/auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses: { "200": { description: Sesión creada }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /v1/auth/logout:
    post:
      operationId: logout
      security: [{ sessionCookie: [] }]
      responses: { "204": { description: Sesión revocada } }
  /v1/platform/organizations:
    post:
      operationId: onboardOrganization
      summary: Crea transaccionalmente empresa, perfil fiscal, primer local y administrador
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TenantOnboardingInput" } } } }
      responses: { "201": { description: Tenant creado }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { description: Identificación fiscal o correo duplicado } }
  /v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Señales administrativas, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /v1/admin/context:
    get:
      operationId: getAdminContext
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Contexto activo de empresa y local, content: { application/json: { schema: { $ref: "#/components/schemas/SessionContext" } } } }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /v1/admin/switch-context:
    post:
      operationId: switchAdminContext
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SwitchContextInput" } } } }
      responses: { "200": { description: Contexto activo actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/ContextSwitchResponse" } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/admin/settings:
    get:
      operationId: getOrganizationSettings
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Configuración monetaria y fiscal, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationSettings" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
    patch:
      operationId: updateOrganizationSettings
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationSettingsInput" } } } }
      responses: { "200": { description: Configuración actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationSettings" } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/admin/organization:
    get:
      operationId: getOrganization
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Empresa de la sesión, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }, "403": { $ref: "#/components/responses/Forbidden" } }
    patch:
      operationId: updateOrganization
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationInput" } } } }
      responses: { "200": { description: Empresa actualizada }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/admin/fiscal-profiles:
    get:
      operationId: listFiscalProfiles
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Perfiles fiscales de la empresa } }
    post:
      operationId: createFiscalProfile
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalProfileInput" } } } }
      responses: { "201": { description: Perfil creado }, "409": { description: País duplicado o perfil predeterminado inválido } }
  /v1/admin/fiscal-profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateFiscalProfile
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FiscalProfileInput" } } } }
      responses: { "204": { description: Perfil actualizado }, "409": { description: Conflicto de perfil } }
    delete:
      operationId: deactivateFiscalProfile
      security: [{ sessionCookie: [] }]
      responses: { "204": { description: Perfil desactivado }, "409": { description: Perfil predeterminado o en uso } }
  /v1/admin/locations:
    get:
      operationId: listLocations
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Locales de la empresa } }
    post:
      operationId: createLocation
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocationInput" } } } }
      responses: { "201": { description: Local creado }, "409": { description: Código duplicado o perfil ajeno } }
  /v1/admin/locations/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateLocation
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocationInput" } } } }
      responses: { "204": { description: Local actualizado } }
    delete:
      operationId: deactivateLocation
      security: [{ sessionCookie: [] }]
      responses: { "204": { description: Local desactivado }, "409": { description: Es el local de la sesión actual } }
  /v1/admin/exchange-rates:
    get:
      operationId: listExchangeRates
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Historial de tipos de cambio } }
    post:
      operationId: createExchangeRate
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeRateInput" } } } }
      responses: { "201": { description: Tipo de cambio registrado }, "409": { description: Par y fecha duplicados } }
  /v1/admin/exchange-rates/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    delete:
      operationId: deleteExchangeRate
      security: [{ sessionCookie: [] }]
      responses: { "204": { description: Tipo de cambio eliminado }, "404": { description: No encontrado } }
  /v1/admin/categories:
    get:
      operationId: listCategories
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: includeInactive, schema: { type: boolean, default: false } }
        - { in: query, name: productType, schema: { type: string, enum: [prepared, retail] }, description: Filtra categorías compatibles con el tipo de producto }
      responses: { "200": { description: Categorías del menú }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      operationId: createCategory
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses: { "201": { description: Categoría creada, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/admin/categories/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateCategory
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses: { "200": { description: Categoría actualizada }, "404": { description: No encontrada }, "403": { $ref: "#/components/responses/Forbidden" } }
    delete:
      operationId: deactivateCategory
      summary: Desactiva una categoría sin productos activos
      security: [{ sessionCookie: [] }]
      responses: { "204": { description: Categoría desactivada }, "409": { description: La categoría contiene productos activos }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/admin/products:
    get:
      operationId: listProducts
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [active, inactive] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Productos, content: { application/json: { schema: { type: object, required: [items, total], properties: { items: { type: array, items: { $ref: "#/components/schemas/Product" } }, total: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createProduct
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } } }
      responses: { "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /v1/admin/products/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    get:
      operationId: getProduct
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Producto }, "404": { description: No encontrado }, "403": { $ref: "#/components/responses/Forbidden" } }
    patch:
      operationId: updateProduct
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } } }
      responses: { "200": { description: Producto actualizado }, "404": { description: No encontrado }, "403": { $ref: "#/components/responses/Forbidden" } }
    delete:
      operationId: deactivateProduct
      summary: Desactiva un producto sin eliminar su historial
      security: [{ sessionCookie: [] }]
      responses: { "204": { description: Producto desactivado }, "404": { description: No encontrado }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/admin/combos:
    get:
      operationId: listCombos
      summary: Lista menús y combos con el total de grupos y alternativas
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Menús y combos, content: { application/json: { schema: { type: object, required: [items, total], properties: { items: { type: array, items: { $ref: "#/components/schemas/ComboSummary" } }, total: { type: integer } } } } } }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      operationId: createCombo
      summary: Crea un producto compuesto con grupos de selección y alternativas
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ComboInput" } } } }
      responses: { "201": { description: Menú o combo creado }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: Alternativa inválida o conflicto } }
  /v1/admin/combos/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateCombo
      summary: Reemplaza la definición de grupos y alternativas del menú o combo
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ComboInput" } } } }
      responses: { "201": { description: Menú o combo actualizado }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { description: No encontrado }, "409": { description: Alternativa inválida o conflicto } }
  /v1/admin/product-availability:
    get:
      operationId: listProductAvailability
      summary: Resuelve la disponibilidad operativa del menú para el local y día de negocio activos
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: categoryId, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Disponibilidad efectiva por producto, content: { application/json: { schema: { type: object, required: [items, businessDate], properties: { items: { type: array, items: { $ref: "#/components/schemas/ProductAvailability" } }, businessDate: { type: string, format: date } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/product-availability/{productId}:
    parameters: [{ in: path, name: productId, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateProductAvailability
      summary: Ajusta el estado operativo y, si aplica, las porciones disponibles del día
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductAvailabilityInput" } } } }
      responses: { "204": { description: Disponibilidad actualizada }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { description: Producto no encontrado }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/admin/inventory:
    get:
      operationId: listInventory
      summary: Existencias físicas de productos vendibles e insumos en el local activo
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Inventario por producto, content: { application/json: { schema: { type: object, required: [items, total], properties: { items: { type: array, items: { $ref: "#/components/schemas/InventoryItem" } }, total: { type: integer } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/inventory/products:
    get:
      operationId: listInventoryProducts
      summary: Artículos activos de inventario que pueden recibir una entrada
      security: [{ sessionCookie: [] }]
      parameters: [{ in: query, name: q, schema: { type: string } }]
      responses:
        "200": { description: Productos seleccionables, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/InventoryProductOption" } } } } } } }
  /v1/admin/inventory/entries:
    post:
      operationId: createInventoryEntry
      summary: Registra una entrada; puede crear un producto vendible o un insumo en la misma transacción
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryEntryInput" } } } }
      responses:
        "201": { description: Entrada registrada atómicamente, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryEntryResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Producto o clasificación incompatible }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/inventory/movements:
    get:
      operationId: listInventoryMovements
      summary: Kárdex del local activo
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: inventoryItemId, schema: { type: string, format: uuid } }
        - { in: query, name: productId, schema: { type: string, format: uuid }, description: Compatibilidad con clientes anteriores }
      responses:
        "200": { description: Movimientos de stock, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/StockMovement" } } } } } } }
  /v1/admin/suppliers:
    get:
      operationId: listSuppliers
      summary: Proveedores de la empresa activa
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [active, inactive] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { "200": { description: Proveedores paginados }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      operationId: createSupplier
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupplierInput" } } } }
      responses: { "201": { description: Proveedor creado, content: { application/json: { schema: { $ref: "#/components/schemas/Supplier" } } } }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: Datos en conflicto } }
  /v1/admin/suppliers/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateSupplier
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupplierInput" } } } }
      responses: { "200": { description: Proveedor actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Supplier" } } } }, "404": { description: No encontrado } }
  /v1/admin/suppliers/{id}/status:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateSupplierStatus
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean } } } } } }
      responses: { "204": { description: Estado actualizado }, "409": { description: Tiene órdenes abiertas } }
  /v1/admin/purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: Órdenes de compra del local activo
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [draft, pending_approval, approved, received, cancelled] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { "200": { description: Órdenes paginadas }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      operationId: createPurchaseOrder
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseOrderInput" } } } }
      responses: { "201": { description: Orden creada en borrador }, "400": { $ref: "#/components/responses/BadRequest" }, "409": { description: Artículo o proveedor incompatible } }
  /v1/admin/purchase-orders/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    get:
      operationId: getPurchaseOrder
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Orden con detalle, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseOrder" } } } }, "404": { description: No encontrada } }
    patch:
      operationId: updatePurchaseOrder
      summary: Reemplaza cabecera y líneas de una orden en borrador
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseOrderInput" } } } }
      responses: { "200": { description: Orden actualizada }, "409": { description: La orden ya no es editable } }
  /v1/admin/purchase-orders/{id}/status:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updatePurchaseOrderStatus
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [draft, pending_approval, approved, cancelled] } } } } } }
      responses: { "204": { description: Estado actualizado }, "409": { description: Transición no permitida } }
  /v1/admin/purchase-orders/{id}/receive:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    post:
      operationId: receivePurchaseOrder
      summary: Recibe una orden aprobada y registra Inventario y Kárdex en la misma transacción
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Orden recibida }, "409": { description: La orden no está aprobada } }
  /v1/operations/product-availability:
    get:
      operationId: listOperationalProductAvailability
      summary: Disponibilidad efectiva del menú para cocina y atención
      security: [{ sessionCookie: [] }]
      parameters: [{ in: query, name: q, schema: { type: string } }, { in: query, name: categoryId, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Menú operativo del local activo }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/operations/product-availability/{productId}:
    parameters: [{ in: path, name: productId, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateOperationalProductAvailability
      summary: Marca disponible, pocas unidades o agotado para el día y local activos
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductAvailabilityInput" } } } }
      responses: { "204": { description: Disponibilidad actualizada }, "400": { $ref: "#/components/responses/BadRequest" }, "404": { description: Producto no encontrado }, "403": { $ref: "#/components/responses/Forbidden" } }
  /v1/admin/customers:
    get:
      operationId: listCustomers
      summary: Lista el directorio de clientes de la empresa activa
      security: [{ sessionCookie: [] }]
      parameters: [{ in: query, name: q, schema: { type: string } }, { in: query, name: status, schema: { type: string, enum: [active, inactive] } }, { in: query, name: segment, schema: { type: string, enum: [new, recurrent, frequent, vip] } }]
      responses: { "200": { description: Directorio paginado de clientes }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      operationId: createCustomer
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerInput" } } } }
      responses: { "201": { description: Cliente creado, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }, "409": { description: Documento duplicado } }
  /v1/admin/customers/{id}:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    get:
      operationId: getCustomer
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Perfil completo del cliente, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }, "404": { description: No encontrado } }
    patch:
      operationId: updateCustomer
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerInput" } } } }
      responses: { "200": { description: Cliente actualizado }, "409": { description: Documento duplicado } }
  /v1/admin/customers/{id}/status:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateCustomerStatus
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean } } } } } }
      responses: { "204": { description: Estado actualizado }, "404": { description: No encontrado } }
  /v1/admin/orders:
    get:
      operationId: listOrders
      summary: Bandeja de pedidos del local activo
      security: [{ sessionCookie: [] }]
      parameters: [{ in: query, name: q, schema: { type: string } }, { in: query, name: channel, schema: { type: string, enum: [salon, mostrador, recojo, delivery, whatsapp] } }, { in: query, name: status, schema: { type: string, enum: [abiertos, nuevo, confirmado, preparando, listo, en_camino, entregado, cancelado] } }]
      responses: { "200": { description: Pedidos paginados con conteos por canal }, "403": { $ref: "#/components/responses/Forbidden" } }
