      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoleInput" } } } }
      responses: { "200": { description: Rol actualizado }, "409": { description: Rol predeterminado protegido } }
  /v1/admin/roles/{id}/status:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch: { operationId: updateRoleStatus, security: [{ sessionCookie: [] }], responses: { "204": { description: Estado actualizado } } }
  /v1/admin/permission-catalog:
