        - { in: query, name: channel, schema: { type: string, enum: [salon, mostrador, recojo, delivery, whatsapp] } }
      responses:
        "200": { description: Comandas de cocina, content: { application/json: { schema: { type: object, required: [items, counts, channelOptions, serverTime], properties: { items: { type: array, items: { $ref: "#/components/schemas/KitchenTicket" } }, counts: { type: object, required: [confirmado, preparando, listo], properties: { confirmado: { type: integer }, preparando: { type: integer }, listo: { type: integer } } }, channelOptions: { type: array, items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string } } } }, serverTime: { type: string, format: date-time } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/kitchen/tickets/{id}/status:
    parameters: [{ $ref: "#/components/parameters/EntityId" }]
    patch:
      operationId: updateKitchenTicketStatus
