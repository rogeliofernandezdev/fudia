name: foods-admin-web

on:
  push:
    paths:
      - "foods-admin-web/**"
      - ".github/workflows/foods-admin-web.yml"
  workflow_dispatch:

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foods-admin-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: foods-admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          FOODS_API_URL: http://localhost:8080

  deploy:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/redesign-nueva-comanda')
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: fudia-dev-frontend-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPO: ${{ vars.ECR_FRONTEND_REPO }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
      CONTAINER_NAME: ${{ vars.FRONTEND_CONTAINER }}
      NEXT_PUBLIC_MAP_PROVIDER: ${{ vars.NEXT_PUBLIC_MAP_PROVIDER }}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          docker build \
            --build-arg NEXT_PUBLIC_MAP_PROVIDER="${NEXT_PUBLIC_MAP_PROVIDER}" \
            --build-arg NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN="${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}" \
            -t "${IMAGE}:${SHORT_SHA}" \
            -t "${IMAGE}:latest" \
            ./foods-admin-web
          docker push "${IMAGE}:${SHORT_SHA}"
          docker push "${IMAGE}:latest"
          echo "uri=${IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to EC2
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          cat > /tmp/commands.json <<EOF
          {
            "commands": [
              "set -eu",
              "aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com'",
              "docker network inspect '${DOCKER_NETWORK}' >/dev/null 2>&1 || docker network create '${DOCKER_NETWORK}'",
              "docker pull '${IMAGE_URI}'",
              "docker rm -f '${CONTAINER_NAME}-previous' >/dev/null 2>&1 || true",
              "if docker inspect '${CONTAINER_NAME}' >/dev/null 2>&1; then docker stop '${CONTAINER_NAME}' && docker rename '${CONTAINER_NAME}' '${CONTAINER_NAME}-previous'; fi",
              "docker run -d --name '${CONTAINER_NAME}' --restart unless-stopped --network '${DOCKER_NETWORK}' --env-file /home/ubuntu/frontend.env -p 127.0.0.1:3000:5175 '${IMAGE_URI}'",
              "sleep 5",
              "test \"\$(docker inspect -f '{{.State.Running}}' '${CONTAINER_NAME}')\" = true"
            ]
          }
          EOF
          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/commands.json \
            --query "Command.CommandId" \
            --output text)
          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
