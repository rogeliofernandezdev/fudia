name: fudia-concierge

on:
  push:
    paths:
      - "fudia-concierge/**"
      - ".github/workflows/fudia-concierge.yml"
  pull_request:
    paths:
      - "fudia-concierge/**"
      - ".github/workflows/fudia-concierge.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fudia-concierge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fudia-concierge/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: mypy src config
      - run: pytest -q
      - run: python -m build
