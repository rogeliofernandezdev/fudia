name: fudia-concierge

on:
  push:
    branches: [aws-deploy1]
    paths:
      - "fudia-concierge/**"
      - ".github/workflows/fudia-concierge.yml"
  workflow_dispatch:

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fudia-concierge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fudia-concierge/pyproject.toml
            fudia-concierge/constraints.txt
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: mypy src config
      - run: pytest -q
      - run: python -m build
      - name: Validate hardened Docker image (no push or deploy)
        run: docker build -t fudia-concierge:ci .

  capacity:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: fudia-concierge
    env:
      REDIS_URL: redis://localhost:6379/0
      FUDIA_REDIS_LOAD_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fudia-concierge/pyproject.toml
            fudia-concierge/constraints.txt
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Redis recovery, fencing, order and retention integration
        env:
          FUDIA_REDIS_INTEGRATION: "1"
        run: pytest -q tests/test_redis_integration.py
      - name: Redis Stream concurrency benchmark
        run: pytest -q -s tests/test_capacity_redis.py
      - name: Publish Redis capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fudia-concierge-redis-capacity
          path: fudia-concierge/concierge-capacity.json
          if-no-files-found: warn
