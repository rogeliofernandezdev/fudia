name: deploy-dev

on:
  push:
    branches:
      - feat/redesign-nueva-comanda
    paths:
      - "foods-backend/**"
      - "foods-admin-web/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fudia-dev-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, push and deploy dev
    runs-on: ubuntu-latest
    environment: dev

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO }}
      ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
      BACKEND_CONTAINER: ${{ vars.BACKEND_CONTAINER }}
      FRONTEND_CONTAINER: ${{ vars.FRONTEND_CONTAINER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        id: images
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=${REGISTRY}/${ECR_BACKEND_REPO}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${ECR_FRONTEND_REPO}" >> "$GITHUB_OUTPUT"

      - name: Build backend
        run: |
          docker build \
            --build-arg VERSION=${{ steps.images.outputs.short_sha }} \
            -t "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.short_sha }}" \
            -t "${{ steps.images.outputs.backend }}:latest" \
            ./foods-backend

      - name: Build frontend
        run: |
          docker build \
            -t "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.short_sha }}" \
            -t "${{ steps.images.outputs.frontend }}:latest" \
            ./foods-admin-web

      - name: Push backend
        run: |
          docker push "${{ steps.images.outputs.backend }}:${{ steps.images.outputs.short_sha }}"
          docker push "${{ steps.images.outputs.backend }}:latest"

      - name: Push frontend
        run: |
          docker push "${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.short_sha }}"
          docker push "${{ steps.images.outputs.frontend }}:latest"

      - name: Deploy on EC2 with SSM
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}:${{ steps.images.outputs.short_sha }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}:${{ steps.images.outputs.short_sha }}
        run: |
          cat > /tmp/commands.json <<EOF
          {
            "commands": [
              "set -eu",
              "REGION='${AWS_REGION}'",
              "REGISTRY='${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com'",
              "aws ecr get-login-password --region '${AWS_REGION}' | docker login --username AWS --password-stdin '${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com'",
              "docker network inspect '${DOCKER_NETWORK}' >/dev/null 2>&1 || docker network create '${DOCKER_NETWORK}'",
              "docker pull '${BACKEND_IMAGE}'",
              "docker pull '${FRONTEND_IMAGE}'",
              "docker rm -f '${BACKEND_CONTAINER}-previous' >/dev/null 2>&1 || true",
              "docker rm -f '${FRONTEND_CONTAINER}-previous' >/dev/null 2>&1 || true",
              "if docker inspect '${BACKEND_CONTAINER}' >/dev/null 2>&1; then docker stop '${BACKEND_CONTAINER}' && docker rename '${BACKEND_CONTAINER}' '${BACKEND_CONTAINER}-previous'; fi",
              "docker run -d --name '${BACKEND_CONTAINER}' --restart unless-stopped --network '${DOCKER_NETWORK}' --env-file /home/ubuntu/backend.env -p 8080:8080 '${BACKEND_IMAGE}'",
              "if docker inspect '${FRONTEND_CONTAINER}' >/dev/null 2>&1; then docker stop '${FRONTEND_CONTAINER}' && docker rename '${FRONTEND_CONTAINER}' '${FRONTEND_CONTAINER}-previous'; fi",
              "docker run -d --name '${FRONTEND_CONTAINER}' --restart unless-stopped --network '${DOCKER_NETWORK}' --env-file /home/ubuntu/frontend.env -p 127.0.0.1:3000:5175 '${FRONTEND_IMAGE}'",
              "sleep 5",
              "docker ps --filter name='${BACKEND_CONTAINER}' --filter name='${FRONTEND_CONTAINER}'",
              "test \"\$(docker inspect -f '{{.State.Running}}' '${BACKEND_CONTAINER}')\" = true",
              "test \"\$(docker inspect -f '{{.State.Running}}' '${FRONTEND_CONTAINER}')\" = true"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/commands.json \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
