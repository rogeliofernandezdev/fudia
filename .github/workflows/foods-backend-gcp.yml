name: foods-backend-gcp

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      database_ready:
        type: boolean
        required: true
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno GCP (independiente de AWS)
        type: choice
        required: true
        default: gcp-dev
        options: [gcp-dev, gcp-staging, gcp-production]
      database_ready:
        description: Confirmo Cloud SQL restaurado, datos verificados y backup previo
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: foods_test
          POSTGRES_USER: foods
          POSTGRES_PASSWORD: foods
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U foods -d foods_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://foods:foods@localhost:5432/foods_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: foods-backend/go.mod
          cache-dependency-path: foods-backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test foods-infrastructure/tests/*.test.mjs
      - run: go run ./cmd/migrate
        working-directory: foods-backend
      - run: go test ./...
        working-directory: foods-backend
      - run: go vet ./...
        working-directory: foods-backend
      - run: go build ./cmd/api ./cmd/migrate
        working-directory: foods-backend

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: foods-${{ inputs.environment }}-gcp-schema-deploy
      cancel-in-progress: false
    env:
      GCP_DATABASE_READY: ${{ inputs.database_ready }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_BACKEND_SERVICE: ${{ vars.GCP_BACKEND_SERVICE }}
      GCP_BACKEND_SERVICE_ACCOUNT: ${{ vars.GCP_BACKEND_SERVICE_ACCOUNT }}
      GCP_MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
      GCP_MIGRATION_SERVICE_ACCOUNT: ${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}
      GCP_MIGRATION_DATABASE_SECRET: ${{ vars.GCP_MIGRATION_DATABASE_SECRET }}
      GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
      GCP_VPC_CONNECTOR: ${{ vars.GCP_VPC_CONNECTOR }}
      GCP_UPLOADS_BUCKET: ${{ vars.GCP_UPLOADS_BUCKET }}
      GCP_IMAGE_PROCESSOR_SERVICE: ${{ vars.GCP_IMAGE_PROCESSOR_SERVICE }}
      GCP_BACKEND_SECRETS: ${{ vars.GCP_BACKEND_SECRETS }}
      GCP_BACKEND_MAX_INSTANCES: ${{ vars.GCP_BACKEND_MAX_INSTANCES }}
      GCP_BACKEND_CONCURRENCY: ${{ vars.GCP_BACKEND_CONCURRENCY }}
      DATABASE_MAX_CONNS: ${{ vars.DATABASE_MAX_CONNS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate deployment configuration
        run: node foods-infrastructure/gcp/deploy.mjs backend validate
      - name: Build image before requesting short-lived credentials
        run: node foods-infrastructure/gcp/deploy.mjs backend build
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - uses: google-github-actions/setup-gcloud@v3
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      - name: Publish, migrate, deploy candidate and promote
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCP_IMAGE_BUILT: "true"
        run: node foods-infrastructure/gcp/deploy.mjs backend
