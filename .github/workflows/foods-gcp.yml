name: foods-gcp

on:
  push:
    branches: [feat/ui-standard]
    paths:
      - "foods-backend/**"
      - "foods-admin-web/**"
      - "fudia-image-processor/**"
      - "fudia-concierge/**"
      - "foods-infrastructure/**"
      - ".github/workflows/foods-*-gcp.yml"
      - ".github/workflows/foods-gcp.yml"
      - ".github/workflows/fudia-concierge-gcp.yml"
      - "!**/*.md"
      - "!**/.env.example"
      - "!**/*.example.json"
      # Prompts are runtime instructions, not documentation.
      - "fudia-concierge/prompts/**"

permissions:
  contents: read
  id-token: write

# Serialize full releases without interrupting a running migration.
concurrency:
  group: foods-gcp-dev-push-deploy
  queue: max
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    environment: gcp-dev
    permissions:
      contents: read
      id-token: write
    outputs:
      processor: ${{ steps.detect.outputs.processor }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      concierge: ${{ steps.detect.outputs.concierge }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify infrastructure and component selection before cloud access
        run: node --test foods-infrastructure/tests/*.test.mjs
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false
      - uses: google-github-actions/setup-gcloud@v3
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
      - id: detect
        name: Detect pending components against active Cloud Run releases
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_IMAGE_PROCESSOR_SERVICE: ${{ vars.GCP_IMAGE_PROCESSOR_SERVICE }}
          GCP_BACKEND_SERVICE: ${{ vars.GCP_BACKEND_SERVICE }}
          GCP_FRONTEND_SERVICE: ${{ vars.GCP_FRONTEND_SERVICE }}
          GCP_CONCIERGE_HTTP_SERVICE: ${{ vars.GCP_CONCIERGE_HTTP_SERVICE }}
          GCP_CONCIERGE_WORKER_POOL: ${{ vars.GCP_CONCIERGE_WORKER_POOL }}
          HEAD_SHA: ${{ github.sha }}
        run: node foods-infrastructure/gcp/changed-components.mjs

  processor:
    needs: changes
    if: ${{ needs.changes.outputs.processor == 'true' }}
    uses: ./.github/workflows/foods-image-processor-gcp.yml
    with:
      environment: gcp-dev
      # Development database already restored by the operator; no restore is run here.
      database_ready: true
    secrets: inherit

  backend:
    needs: [changes, processor]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.backend == 'true' &&
          (needs.processor.result == 'success' || needs.processor.result == 'skipped') }}
    uses: ./.github/workflows/foods-backend-gcp.yml
    with:
      environment: gcp-dev
      database_ready: true
    secrets: inherit

  frontend:
    needs: [changes, processor, backend]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.frontend == 'true' &&
          (needs.processor.result == 'success' || needs.processor.result == 'skipped') &&
          (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    uses: ./.github/workflows/foods-admin-web-gcp.yml
    with:
      environment: gcp-dev
    secrets: inherit

  concierge:
    needs: [changes, processor, backend]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.concierge == 'true' &&
          (needs.processor.result == 'success' || needs.processor.result == 'skipped') &&
          (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    uses: ./.github/workflows/fudia-concierge-gcp.yml
    with:
      environment: gcp-dev
      activate_concierge: true
      deploy_backend: false
    secrets: inherit
