name: foods-gcp

on:
  push:
    branches: [feat/ui-standard]
    paths:
      - "foods-backend/**"
      - "foods-admin-web/**"
      - "fudia-image-processor/**"
      - "foods-infrastructure/**"
      - ".github/workflows/foods-*-gcp.yml"
      - ".github/workflows/foods-gcp.yml"

permissions:
  contents: read
  id-token: write

# Serialize full releases without interrupting a running migration.
concurrency:
  group: foods-gcp-dev-push-deploy
  queue: max
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      processor: ${{ steps.detect.outputs.processor }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - id: detect
        name: Detect changed components across the whole push
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node foods-infrastructure/gcp/changed-components.mjs

  processor:
    needs: changes
    if: ${{ needs.changes.outputs.processor == 'true' }}
    uses: ./.github/workflows/foods-image-processor-gcp.yml
    with:
      environment: gcp-dev
      # Development database already restored by the operator; no restore is run here.
      database_ready: true
    secrets: inherit

  backend:
    needs: [changes, processor]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.backend == 'true' &&
          (needs.processor.result == 'success' || needs.processor.result == 'skipped') }}
    uses: ./.github/workflows/foods-backend-gcp.yml
    with:
      environment: gcp-dev
      database_ready: true
    secrets: inherit

  frontend:
    needs: [changes, processor, backend]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
          needs.changes.outputs.frontend == 'true' &&
          (needs.processor.result == 'success' || needs.processor.result == 'skipped') &&
          (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    uses: ./.github/workflows/foods-admin-web-gcp.yml
    with:
      environment: gcp-dev
    secrets: inherit
